<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

</head>

<body>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Edit Student</h2>
            <form id="editStudentForm">
                <!-- <label for="instructorId">Instructor ID</label>
                <input type="text" id="instructorId" required> -->
    
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" required>
    
                <!-- <label for="studentId">Student ID</label>
                <input type="text" id="studentId" required> -->
    
                <label for="course">Course</label>
                <input type="text" id="course" required>
    
                <label for="attendance">Attendance (%)</label>
                <input type="number" id="attendance" min="0" max="100">
    
                <label for="gradeAssignments">Assignments Grade</label>
                <input type="number" id="gradeAssignments" min="0" max="100">
    
                <label for="gradeQuizzes">Quizzes Grade</label>
                <input type="number" id="gradeQuizzes" min="0" max="100">
    
                <label for="gradeExam">Exam Grade</label>
                <input type="number" id="gradeExam" min="0" max="100">
    
                <label for="studentFeedback">Feedback</label>
                <input type="text" id="studentFeedback">
    
                <label for="studentStatus">Status</label>
                <select id="studentStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
    
                <div class="modal-buttons">
                    <a href="../pages/student.html"><button type="button" id="cancelAdd">Cancel</button></a>
                    <button type="submit" id="edit-student">Edit Student</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../script/edit-student.js"></script>

</body>

</html>
