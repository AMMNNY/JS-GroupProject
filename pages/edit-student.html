<div class="modal" id="editModal">

    <div class="modal-content">

        <h2>Edit Student</h2>

        <form id="editStudentForm">

            <label for="editStudentId">
                Student ID
            </label>

            <input
                type="text"
                id="editStudentId"
                required
            >


            <label for="editStudentName">
                Student Name
            </label>

            <input
                type="text"
                id="editStudentName"
                required
            >


            <label for="editStudentCourse">
                Course
            </label>

            <input
                type="text"
                id="editStudentCourse"
                required
            >


            <div class="modal-buttons">

                <button type="button" id="cancelEdit">
                    Cancel
                </button>

                <button type="submit">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>
