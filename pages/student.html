<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduTrack | Students</title>

    <link rel="stylesheet" href="../style/student.css">
    <link rel="stylesheet" href="../style/night-mode.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <div class="dashboard">
        <main class="main-content">

            <header class="topbar">

                <div class="page-intro">
                    <h2>Students</h2>
                    <p class="page-intro-p">
                        Manage and track student progress
                    </p>
                </div>


                <div class="header-actions">

                    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle night mode"
                        aria-pressed="false">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <a href="InstructorProfile.html">    
                    <button class="avatar">
                        FE

                    </button>
                    </a>
                </div>

            </header>


            <div class="student-body">

                <!-- Filters -->
                <div class="students-filters">

                    <div class="search-box">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input type="search" class="student-search" id="student-search"
                            placeholder="Search by name or student ID...">

                    </div>

                    <button type="button" class="add-student" id="add-student">
                        <i class="fa-solid fa-plus"></i>
                        Add Student
                    </button>
                </div>


                <!-- Students Table -->
                <div class="table-container">

                    <table class="students-table">

                        <thead>

                            <tr>
                                <th>STUDENT</th>
                                <th>COURSE</th>
                                <th>PROGRESS</th>
                                <th>GRADE</th>
                                <th></th>
                            </tr>

                        </thead>


                        <tbody id="students-list">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <script type="module" src="../script/student-managment.js"></script>
    <script type="module" src="../script/add-student.js"></script>
    <script src="../script/night-mode.js"></script>
    <!-- Add Student Modal -->

    <div class="modal-overlay" id="addStudentModal">

        <div class="add-student-modal">

            <div class="modal-header">

                <div>
                    <h3>Add Student</h3>
                    <p>Add a new student to your class</p>
                </div>

                <button type="button" class="close-modal" id="closeAddModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <form id="addStudentForm">

                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input type="text" id="studentId" placeholder="e.g. ST007" required>

                </div>


                <div class="form-group">

                    <label for="studentName">
                        Student Name
                    </label>

                    <input type="text" id="studentName" placeholder="Enter student name" required>

                </div>


                <div class="form-group">

                    <label for="studentCourse">
                        Course
                    </label>

                    <input type="text" id="studentCourse" placeholder="e.g. JavaScript" required>

                </div>


                <div class="form-group">

                    <label for="studentFeedback">
                        Feedback
                    </label>

                    <textarea id="studentFeedback" placeholder="Add feedback for the student..." rows="3"></textarea>

                </div>


                <div class="form-group">

                    <label for="studentActivation">
                        Status
                    </label>

                    <select id="studentActivation">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <div class="modal-buttons">

                    <button type="button" class="cancel-btn" id="cancelAdd">
                        Cancel
                    </button>

                    <button type="submit" class="save-student-btn" id="add-new-student">
                        Add Student
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Edit Student Modal -->
    
    <div class="modal-overlay" id="editStudentModal">
    
        <div class="add-student-modal">
    
            <div class="modal-header">
    
                <div>
                    <h3>Edit Student</h3>
                    <p>Update student information</p>
                </div>
    
                <button type="button" class="close-modal" id="closeEditModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
    
            </div>
    
    
            <form id="editStudentForm">
    
                <div class="form-group">
    
                    <label for="editStudentName">
                        Student Name
                    </label>
    
                    <input type="text" id="editStudentName" required>
    
                </div>
    
    
                <div class="form-group">
    
                    <label for="editCourse">
                        Course
                    </label>
    
                    <input type="text" id="editCourse" required>
    
                </div>
    
    
                <div class="form-group">
    
                    <label for="editAttendance">
                        Attendance (%)
                    </label>
    
                    <input type="number" id="editAttendance" min="0" max="100">
    
                </div>
    
    
                <div class="form-group">
    
                    <label for="editAssignments">
                        Assignments Grade
                    </label>
    
                    <input type="number" id="editAssignments" min="0" max="100">
    
                </div>
    
    
                <div class="form-group">
    
                    <label for="editQuizzes">
                        Quizzes Grade
                    </label>
    
                    <input type="number" id="editQuizzes" min="0" max="100">
    
                </div>
    
    
                <div class="form-group">
    
                    <label for="editExam">
                        Exam Grade
                    </label>
    
                    <input type="number" id="editExam" min="0" max="100">
    
                </div>
    
    
                <div class="form-group">
    
                    <label for="editFeedback">
                        Feedback
                    </label>
    
                    <textarea id="editFeedback" rows="3"></textarea>
    
                </div>
    
    
                <div class="form-group">
    
                    <label for="editStatus">
                        Status
                    </label>
    
                    <select id="editStatus">
    
                        <option value="Active">
                            Active
                        </option>
    
                        <option value="Inactive">
                            Inactive
                        </option>
    
                    </select>
    
                </div>
    
    
                <div class="modal-buttons">
    
                    <button type="button" class="cancel-btn" id="cancelEdit">
                        Cancel
                    </button>
    
                    <button type="submit" class="save-student-btn">
                        Save Changes
                    </button>
    
                </div>
    
            </form>
    
        </div>
    
    </div>

    <!-- Delete Student Modal -->
    
    <div class="modal-overlay" id="deleteStudentModal">
    
        <div class="add-student-modal delete-popup">
    
            <div class="modal-header">
    
                <div>
                    <h3>Delete Student</h3>
                    <p>Are you sure you want to delete this student?</p>
                </div>
    
                <button type="button" class="close-modal" id="closeDeleteModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
    
            </div>
    
    
            <div class="modal-buttons">
    
                <button type="button" class="cancel-btn" id="cancelDelete">
                    Cancel
                </button>
    
                <button type="button" class="delete-confirm-btn" id="confirmDelete">
                    Delete
                </button>
    
            </div>
    
        </div>
    
    </div>

</body>

</html>
