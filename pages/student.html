<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduTrack | Students</title>

    <link rel="stylesheet" href="../style/student.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <div class="sidebar-content">
                <p>Dashboard</p>
            </div>
        </aside>


        <main class="main-content">

            <header class="topbar">

                <div class="page-intro">
                    <h2>Students</h2>
                    <p class="page-intro-p">
                        Manage and track student progress
                    </p>
                </div>


                <div class="header-actions">

                    <button class="icon-button" id="theme-toggle">
                        <i class="fa-solid fa-moon"></i>
                    </button>

                    <button class="avatar">
                            FE
                        
                    </button>
                </div>

            </header>


            <div class="student-body">

                <!-- Filters -->
                <div class="students-filters">

                    <div class="search-box">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input type="search" class="student-search" placeholder="Search by name or email...">

                    </div>

                    <input type="submit" value="Add Student" class="add-student">

                    <select class="course-filter" id="course-filter">

                        <option value="">All Courses</option>
                    </select>

                </div>


                <!-- Students Table -->
                <div class="table-container">

                    <table class="students-table">

                        <thead>

                            <tr>
                                <th>STUDENT</th>
                                <th>COURSE</th>
                                <th>PROGRESS</th>
                                <th>GRADE</th>
                                <th></th>
                            </tr>

                        </thead>


                        <tbody>

                            <tr>

                                <td>
                                    <div class="student-info">

                                        <img src="user_profile_female_icon_192701.webp" alt="Maya Chen"
                                            class="student-avatar">

                                        <span>Maya Chen</span>

                                    </div>
                                </td>

                                <td>Algebra II</td>

                                <td>

                                    <div class="progress-container">

                                        <div class="progress-bar">
                                            <span style="width: 75%;"></span>
                                        </div>

                                        <span class="progress-value">75%</span>

                                    </div>

                                </td>

                                <td>
                                    <span class="grade">A</span>
                                </td>
                                <td>
                                    <span>
                                        <i class="fa-regular fa-pen-to-square"></i>
                                        <i class="fa-regular fa-trash-can"></i>
                                    </span>
                                </td>

                            </tr>


                            <tr>

                                <td>
                                    <div class="student-info">

                                        <img src="user_profile_female_icon_192701.webp" alt="Maya Chen"
                                            class="student-avatar">

                                        <span>Maya Chen</span>

                                    </div>
                                </td>

                                <td>Algebra II</td>

                                <td>

                                    <div class="progress-container">

                                        <div class="progress-bar">
                                            <span style="width: 60%;"></span>
                                        </div>

                                        <span class="progress-value">60%</span>

                                    </div>

                                </td>

                                <td>
                                    <span class="grade">A</span>
                                </td>
                                <td>
                                    <span>
                                        <i class="fa-regular fa-pen-to-square"></i>
                                        <i class="fa-regular fa-trash-can"></i>
                                    </span>
                                </td>

                            </tr>


                            <tr>

                                <td>
                                    <div class="student-info">

                                        <img src="user_profile_female_icon_192701.webp" alt="Maya Chen"
                                            class="student-avatar">

                                        <span>Maya Chen</span>

                                    </div>
                                </td>

                                <td>Algebra II</td>

                                <td>

                                    <div class="progress-container">

                                        <div class="progress-bar">
                                            <span style="width: 90%;"></span>
                                        </div>

                                        <span class="progress-value">90%</span>

                                    </div>

                                </td>

                                <td>
                                    <span class="grade">A</span>
                                </td>
                                <td>
                                    <span>
                                        <i class="fa-regular fa-pen-to-square"></i>
                                        <i class="fa-regular fa-trash-can"></i>
                                    </span>
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <script src="../script/student.js"></script>

</body>

</html>
