<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - EduTrack</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="../style/styleLoginReg.css">
</head>
<body>

   <main class="auth-container">
        <div class="auth-card">
            <h2>Edit Profile</h2>
            <p class="subtitle">Update your personal account information</p>

            <form id="profile-form">
                
                <!-- Instructor Full Name -->
                <div class="form-group">
                    <label for="instructor-name">Full Name</label>
                    <input type="text" id="instructor-name" placeholder="Enter your full name" required />
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required />
                </div>

                <!-- Submit Button -->
                <button type="submit" id="save" class="btn-primary">Save Changes</button>

                <!-- Feedback Message Container -->
                <div id="feedback" class="feedback-message"></div>

                <!-- Footer Link -->
                <div class="auth-footer">
                    <a href="index.html">Back to Dashboard</a>
                </div>

            </form>
        </div>
    </main>

    <!-- JS Logic -->
    <script type="module" src="../script/editProfile.js"></script>
</body>
</html>
