<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduTrack</title>

    <link rel="stylesheet" href="../style/sidebar.css">
    <link rel="stylesheet" href="../style/analytics_dashboard.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <aside class="sidebar">

        <h2>EduTrack</h2>

        <nav>
            <ul>

                <li>
                    <a href="#/Dashboard">Dashboard</a>
                </li>

                <li>
                    <a href="#/Students">Students</a>
                </li>

                <li>
                    <a href="#/Courses">Courses</a>
                </li>

            </ul>
        </nav>

        <button id="logoutButton">
            Logout
        </button>

    </aside>


    <main>
        <section id="Dynmic"></section>
    </main>


    <script type="module">
        import coursesFunction from "../script/courses.js"
        const dynmic = document.getElementById("Dynmic");
        import { initDashboard } from "../script/analytics_dashboard.js";
        import { initStudents } from "../script/student-managment.js";
        import { addStudent } from "../script/add-student.js";
        import { editStudent } from "../script/edit-student.js";
        import { deleteeStudent } from "../script/delete-student.js";
        import { initArchive } from "../script/archive-student.js";


        function loadScript(scriptName) {

            return new Promise(function (resolve, reject) {

                const script = document.createElement("script");

                script.type = "module";
                script.src = `../script/${scriptName}`;

                script.onload = function () {
                    script.remove();
                    resolve();
                };

                script.onerror = function () {

                    console.error(
                        `Unable to load ../script/${scriptName}`
                    );

                    script.remove();
                    reject();

                };

                document.body.appendChild(script);

            });

        }


        function loadPage() {

            const requestedHash = location.hash;

            let page = requestedHash;


            if (page === "#/Students") {

                page = "student.html";

            } else if (page === "#/Dashboard") {

                page = "analytics_dashboard.html";
            }else if (page === "#/Courses") {
                page = "Courses.html";
            }

            fetch(`./${page}`)
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(`Unable to load ${page}: ${response.status}`);
                    }
                    return response.text();
                })
                .then((data) => {
                    dynmic.innerHTML = data;


                    // Night Mode
                    loadScript("night-mode.js");


                    if (requestedHash === "#/Dashboard") {

                        // loadScript("analytics_dashboard.js");

                        initDashboard();
                    }
                    else if(requestedHash === "#/Courses"){
                        coursesFunction()
                    }


                    else if (requestedHash === "#/Students") {

                        // loadScript("student-managment.js");
                        initStudents();

                        addStudent();

                        editStudent();

                        deleteeStudent();
                        initArchive();

                    }

                })


                .catch((error) => {

                    console.error(error);

                });

        }


        window.addEventListener("hashchange", loadPage);

        // Open Dashboard by default
        if (!location.hash) {
            location.hash = "#/Dashboard";
        } else {
            loadPage();
        }



    </script>
<script type="module" src="../script/main.js"></script>
</body>

</html>
