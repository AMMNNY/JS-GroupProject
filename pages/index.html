<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduTrack</title>

    <link rel="stylesheet" href="../style/sidebar.css">
    <link rel="stylesheet" href="../style/analytics_dashboard.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="site-sidebar" aria-expanded="false">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <button class="sidebar-backdrop" type="button" aria-label="Close navigation menu" tabindex="-1"></button>

    <aside class="sidebar" id="site-sidebar" aria-label="Main navigation">

        <h2 class="sidebar-title">EduTrack</h2>

        <nav class="sidebar-nav">
            <ul class="sidebar-list">

                <li class="sidebar-item">
                    <a class="sidebar-link" href="#/Dashboard">Dashboard</a>
                </li>

                <li class="sidebar-item">
                    <a class="sidebar-link" href="#/Students">Students</a>
                </li>

                <li class="sidebar-item">
                    <a class="sidebar-link" href="#/Courses">Courses</a>
                </li>

            </ul>
        </nav>

        <button class="sidebar-logout" id="logoutButton">
            Logout
        </button>

    </aside>


    <main>
        <section id="Dynmic"></section>
    </main>


    <script type="module">
        import coursesFunction from "../script/courses.js"
        import { initDashboard } from "../script/analytics_dashboard.js";
        import { initStudents } from "../script/student-managment.js";

        const dynmic = document.getElementById("Dynmic");
        const sidebar = document.getElementById("site-sidebar");
        const menuToggle = document.querySelector(".menu-toggle");
        const menuToggleIcon = menuToggle.querySelector("i");
        const sidebarBackdrop = document.querySelector(".sidebar-backdrop");

        function setSidebarOpen(isOpen) {
            sidebar.classList.toggle("is-open", isOpen);
            menuToggle.setAttribute("aria-expanded", String(isOpen));
            menuToggle.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
            menuToggleIcon.classList.toggle("fa-bars", !isOpen);
            menuToggleIcon.classList.toggle("fa-xmark", isOpen);
            sidebarBackdrop.classList.toggle("is-visible", isOpen);
        }

        menuToggle.addEventListener("click", function () {
            setSidebarOpen(!sidebar.classList.contains("is-open"));
        });

        sidebarBackdrop.addEventListener("click", function () {
            setSidebarOpen(false);
        });

        sidebar.querySelectorAll(".sidebar-link").forEach(function (link) {
            link.addEventListener("click", function () {
                setSidebarOpen(false);
            });
        });

        window.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                setSidebarOpen(false);
            }
        });

        function loadScript(scriptName) {

            return new Promise(function (resolve, reject) {

                const script = document.createElement("script");

                script.type = "module";
                script.src = `../script/${scriptName}`;

                script.onload = function () {
                    script.remove();
                    resolve();
                };

                script.onerror = function () {

                    console.error(
                        `Unable to load ../script/${scriptName}`
                    );

                    script.remove();
                    reject();

                };

                document.body.appendChild(script);

            });

        }


        function loadPage() {

            const requestedHash = location.hash;

            let page = requestedHash;


            if (page === "#/Students") {

                page = "student.html";

            } else if (page === "#/Dashboard") {

                page = "analytics_dashboard.html";
            }else if (page === "#/Courses") {
                page = "Courses.html";
            }

            fetch(`./${page}`)
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(`Unable to load ${page}: ${response.status}`);
                    }
                    return response.text();
                })
                .then((data) => {
                    dynmic.innerHTML = data;


                    // Night Mode
                    loadScript("night-mode.js");


                    if (requestedHash === "#/Dashboard") {

                        // loadScript("analytics_dashboard.js");

                        initDashboard();
                    }
                    else if(requestedHash === "#/Courses"){
                        coursesFunction()
                    }


                    else if (requestedHash === "#/Students") {

                        // loadScript("student-managment.js");
                        initStudents();

                        loadScript("add-student.js");

                        loadScript("edit-student.js");

                        loadScript("delete-student.js");

                    }

                })


                .catch((error) => {

                    console.error(error);

                });

        }


        window.addEventListener("hashchange", loadPage);

        // Open Dashboard by default
        if (!location.hash) {
            location.hash = "#/Dashboard";
        } else {
            loadPage();
        }



    </script>
<script type="module" src="../script/main.js"></script>
</body>

</html>
