<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTrack - Sign In</title>
  <link rel="stylesheet" href="../style/styleLoginReg.css">
</head>

<body>



  <!-- Login Form -->
  <div class="auth-container">
    <div class="auth-card">
      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Login to access your EduTrack Dashboard</p>
 
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="example@domain.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

      <!-- submit button -->
        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <div id="loginFeedback" class="feedback-message"></div>
      <!-- sign up -->
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script type="module" src="../script/main.js"></script>
</body>
</html>
