<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../style/analytics_dashboard.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <div class="heading-group">
                <h1>Good Morning, <span id="instructorName">Alex</span></h1>
                <p>Here's what's happening across your classes today.</p>
            </div>
            <div class="header-actions">
                <!-- Night Mode Toggle -->
                <button class="night-mode" aria-label="Toggle night mode" aria-pressed="false" id="theme-toggle">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <!-- Avatar -->
                <div class="avatar" aria-label="User profile">
                    AM
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard">


        <!-- Top Metric Cards Grid -->
        <div class="metrics-grid">
            <!-- Performance score card -->
            <div class="metric-card">
                <div class="metric-top">
                    <div>
                        <span class="metric-label">Total Students</span>
                        <div class="metric-value" id="totalStudents">81.4</div>
                    </div>
                    <div class="metric-icon icon-orange">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                </div>

            </div>

            <!-- Completion rate card -->
            <div class="metric-card">
                <div class="metric-top">
                    <div>
                        <span class="metric-label">Attendance Rate</span>
                        <div class="metric-value" id="attendanceRate">92.6%</div>
                    </div>
                    <div class="metric-icon icon-blue">
                        <i class="fa-regular fa-calendar-check"></i>
                    </div>
                </div>
            </div>

            <!-- Attendance rate card -->
            <div class="metric-card">
                <div class="metric-top">
                    <div>
                        <span class="metric-label">Total Courses</span>
                        <div class="metric-value" id="totalCourses">12</div>
                    </div>
                    <div class="metric-icon icon-green">
                        <i class="fa-solid fa-book"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Middle Section Grid -->
        <div class="analysis-grid">
            <!-- Performance Over Time (2 Cols) -->
            <div class="panel performance-panel">
                <div class="panel-heading performance-heading">
                    <div>
                        <h2>Student Performance</h2>
                        <p>Overall student performance metrics</p>
                    </div>
                </div>

                <!-- Chart Container -->
                <div class="chart-container performance-chart-container">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>

            <!-- Course Completion (1 Col) -->
            <div class="panel completion-panel">
                <div>
                    <div class="panel-heading">
                        <h2>Students by course</h2>
                        <p>Enrolled students in each course</p>
                    </div>
                </div>

                <div class="completion-content">
                    <!-- Donut Canvas Container -->
                    <div class="donut-container">
                        <canvas id="completionChart"></canvas>
                        <!-- Center Label -->
                        <div class="donut-label">
                            <span>0</span>
                        </div>
                    </div>

                    <!-- Legend Items -->
                    <div class="completion-legend"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: Attendance by Course -->
        <div class="panel attendance-panel">
            <div class="panel-heading">
                <h2>Attendance by course</h2>
                <p>Average attendance rate</p>
            </div>

            <div class="chart-container attendance-chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>
        </div>

    </main>

    <script src="../script/night-mode.js"></script>
</body>
</html>
