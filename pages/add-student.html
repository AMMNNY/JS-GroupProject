<div class="modal" id="addModal">

    <div class="modal-content">

        <h2>Add Student</h2>

        <form id="addStudentForm">

            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                required
            >


            <label for="studentName">
                Student Name
            </label>

            <input
                type="text"
                id="studentName"
                required
            >


            <label for="studentCourse">
                Course
            </label>

            <input
                type="text"
                id="studentCourse"
                required
            >


            <div class="modal-buttons">

                <button type="button" id="cancelAdd">
                    Cancel
                </button>

                <button type="submit">
                    Add Student
                </button>

            </div>

        </form>

    </div>

</div>
