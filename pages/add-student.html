<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Add Student</h2>
            <form id="addStudentForm">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" required>
                
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" required>
                
                <label for="studentCourse">Course</label>
                <input type="text" id="studentCourse" required>
                
                <label for="studentFeedback">Feedback</label>
                <input type="text" id="studentFeedback">
                
                <label for="studentActivation">Status</label>
                <select id="studentActivation">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
                <div class="modal-buttons">
                    <a href="../pages/student.html"><button type="button" id="cancelAdd">Cancel</button></a>
                    
                    <button type="submit" id="add-new-student">Add Student</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../script/student-managmant.js"></script>
</body>
</html>
